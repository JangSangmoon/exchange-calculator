<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 여행 환율 계산기</title>

 <link rel="manifest" href="manifest.json">
 
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:20px 0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:#eef0f5;
    display:flex; justify-content:center;
  }
  .app {
    width:100%; max-width:440px; background:#fff;
    border-radius:20px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.12);
  }
  .header {
    background:linear-gradient(135deg,#7c5cff,#5b3df0);
    color:#fff; padding:24px 20px; text-align:center;
  }
  .header h1 { margin:0; font-size:20px; font-weight:700; }
  .body { padding:20px; }
  label.field-label {
    display:block; font-size:13px; font-weight:700; color:#333;
    margin:18px 0 6px;
  }
  label.field-label small { font-weight:400; color:#888; font-size:11.5px; }
  select#countrySelect {
    width:100%; padding:12px 14px; font-size:15px; border-radius:10px;
    border:1px solid #ddd; background:#fafafa; font-weight:600;
  }
  .realtime-box {
    margin-top:16px; background:#eef1ff; border-radius:12px;
    padding:14px 16px;
  }
  .realtime-box .dot-title {
    font-size:13px; font-weight:700; color:#4b3ee0;
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block; }
  .realtime-box .line { font-size:15px; font-weight:700; color:#222; line-height:1.6; }
  .tip-line {
    margin-top:10px; background:#fff8e6; border:1px solid #ffe4a3;
    border-radius:8px; padding:8px 12px; font-size:12.5px; color:#8a5a00;
  }
  .input-group {
    display:flex; align-items:center; border:1.5px solid #d8d8ea;
    border-radius:10px; overflow:hidden; background:#fff;
  }
  .input-group:focus-within { border-color:#7c5cff; }
  .input-group .prefix {
    padding:0 12px; font-weight:700; color:#555; background:#f5f5fa;
    height:46px; display:flex; align-items:center; font-size:14px;
  }
  .input-group input {
    flex:1; border:none; outline:none; padding:0 12px; font-size:16px;
    font-weight:700; height:46px; color:#222; min-width:0;
    background:transparent;
  }
  .input-group .suffix {
    padding:0 14px; font-weight:700; color:#555; background:#f5f5fa;
    height:46px; display:flex; align-items:center; font-size:13px; white-space:nowrap;
  }
  .input-group.readonly-like .suffix { color:#888; }
  .banner {
    margin-top:16px; border-radius:10px; padding:12px 14px;
    font-size:13.5px; font-weight:700; line-height:1.5;
  }
  .banner.expensive { background:#fee2e2; color:#c81e1e; }
  .banner.cheap { background:#dcfce7; color:#1a8a44; }
  .banner.same { background:#f1f1f1; color:#555; }
  .history-section {
    margin-top:26px; border-top:1px solid #eee; padding-top:16px;
  }
  .history-title {
    font-size:14px; font-weight:700; color:#333; display:flex;
    align-items:center; gap:6px; cursor:pointer; user-select:none;
  }
  .history-body { margin-top:12px; display:none; }
  .history-body.open { display:block; }
  .history-row-inputs { display:flex; gap:6px; margin-bottom:8px; }
  .history-row-inputs input {
    flex:1; min-width:0; padding:9px 8px; border:1px solid #ddd; border-radius:8px;
    font-size:12.5px;
  }
  .history-add-btn {
    width:100%; padding:10px; background:#7c5cff; color:#fff; border:none;
    border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; margin-top:4px;
  }
  table.history-table {
    width:100%; border-collapse:collapse; margin-top:12px; font-size:11.5px;
  }
  table.history-table th, table.history-table td {
    border-bottom:1px solid #eee; padding:7px 4px; text-align:center;
  }
  table.history-table th { background:#f8f8fc; color:#666; font-weight:700; }
  .badge { display:inline-block; padding:2px 6px; border-radius:6px; font-size:10.5px; font-weight:700; }
  .badge.low { background:#dcfce7; color:#1a8a44; }
  .badge.high { background:#fee2e2; color:#c81e1e; }
  .diff-plus { color:#c81e1e; font-weight:700; }
  .diff-minus { color:#1a8a44; font-weight:700; }
  .del-btn { background:none; border:none; color:#bbb; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>🌍 스마트 여행 환율 계산기</h1>
  </div>

  <div class="body">

    <label class="field-label">여행 국가 선택</label>
    <select id="countrySelect"></select>

    <div class="realtime-box">
      <div class="dot-title"><span class="dot"></span> 현 실시간 환율</div>
      <div class="line" id="line1">1 USD = 1,466.30 원 (KRW)</div>
      <div class="line" id="line2">1,000 원 = 17,953.32 동 (VND)</div>
    </div>
    <div class="tip-line" id="tipLine">💡 팁: 강제 아님 · 흥정 필수 · 달러결제시 매장 환율 확인</div>

    <label class="field-label">가게 적용 환율 <small>(1달러당 원화)</small></label>
    <div class="input-group">
      <span class="prefix">$</span>
      <input id="storeRateInput" type="text" inputmode="decimal" value="1,510">
    </div>

    <label class="field-label">구매 금액 <small>(USD : 달러) — 가게가 부른 금액</small></label>
    <div class="input-group">
      <input id="usdInput" type="text" inputmode="decimal" value="50">
      <span class="suffix">USD</span>
    </div>

    <label class="field-label">현지화폐 환산액 <small id="localLabelSmall">(VND : 동) — 직접 입력 가능</small></label>
    <div class="input-group">
      <input id="localInput" type="text" inputmode="decimal" value="0">
      <span class="suffix" id="localSuffix">VND</span>
    </div>

    <label class="field-label">최종 결제 금액 <small>(KRW : 원화) — 직접 입력해서 역산도 가능</small></label>
    <div class="input-group">
      <input id="krwInput" type="text" inputmode="decimal" value="0">
      <span class="suffix">원</span>
    </div>

    <div class="banner" id="banner"></div>

    <div class="history-section">
      <div class="history-title" id="historyToggle">🏪 매장별 환율 히스토리 비교 <span id="historyArrow">▾</span></div>
      <div class="history-body" id="historyBody">
        <div class="history-row-inputs">
          <input id="hName" placeholder="매장명" type="text">
          <input id="hRate" placeholder="환율($당원)" type="text" inputmode="decimal">
          <input id="hUsd" placeholder="구매액(USD)" type="text" inputmode="decimal">
        </div>
        <button class="history-add-btn" id="hAddBtn">+ 비교 리스트에 추가</button>
        <table class="history-table" id="historyTable" style="display:none;">
          <thead>
            <tr><th>매장</th><th>환율</th><th>결제액(원)</th><th>시세대비</th><th>비고</th><th></th></tr>
          </thead>
          <tbody id="historyTbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
// ---------- 국가 데이터 (2026.07.27 기준 환율, USD/KRW는 공통 기준) ----------
const BASE_USD_KRW = 1466.30;
const COUNTRIES = [
  { code:'VN', flag:'🇻🇳', name:'베트남',   currency:'VND', usdToLocal:26324.9552, tip:'💡 팁: 강제 아님 · 흥정 필수 · 달러결제시 매장 환율 확인' },
  { code:'US', flag:'🇺🇸', name:'미국',     currency:'USD', usdToLocal:1,          tip:'💡 팁: 15~20% 필수 · 세금은 별도 계산대에서 추가' },
  { code:'JP', flag:'🇯🇵', name:'일본',     currency:'JPY', usdToLocal:164.6,      tip:'💡 팁: 불필요(실례) · 소비세 10% 포함가 표시' },
  { code:'TH', flag:'🇹🇭', name:'태국',     currency:'THB', usdToLocal:33.80,      tip:'💡 팁: 소액 감사 표시 정도 · 재래시장 흥정 가능' },
  { code:'PH', flag:'🇵🇭', name:'필리핀',   currency:'PHP', usdToLocal:61.71,      tip:'💡 팁: 10% 서비스차지 자동 부과 흔함' },
  { code:'SG', flag:'🇸🇬', name:'싱가포르', currency:'SGD', usdToLocal:1.293,      tip:'💡 팁: 불필요 · GST+서비스차지 이미 포함' },
  { code:'HK', flag:'🇭🇰', name:'홍콩',     currency:'HKD', usdToLocal:7.844,      tip:'💡 팁: 10% 서비스차지 자동 포함 흔함' },
  { code:'TW', flag:'🇹🇼', name:'대만',     currency:'TWD', usdToLocal:32.37,      tip:'💡 팁: 불필요 · 야시장 흥정 가능' },
  { code:'EU', flag:'🇪🇺', name:'유럽',     currency:'EUR', usdToLocal:0.8823,     tip:'💡 팁: 반올림 정도만 · 택스프리 환급 가능' },
  { code:'CN', flag:'🇨🇳', name:'중국',     currency:'CNY', usdToLocal:6.797,      tip:'💡 팁: 불필요 · 모바일결제 위주' },
];

const els = {
  countrySelect: document.getElementById('countrySelect'),
  line1: document.getElementById('line1'),
  line2: document.getElementById('line2'),
  tipLine: document.getElementById('tipLine'),
  storeRate: document.getElementById('storeRateInput'),
  usd: document.getElementById('usdInput'),
  local: document.getElementById('localInput'),
  krw: document.getElementById('krwInput'),
  localLabelSmall: document.getElementById('localLabelSmall'),
  localSuffix: document.getElementById('localSuffix'),
  banner: document.getElementById('banner'),
};

let state = {
  country: COUNTRIES[0],
  storeRate: 1510,
  usd: 50,
  local: 0,
  krw: 0,
};

// ---------- 유틸 ----------
function parseNum(str){
  const n = parseFloat(String(str).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}
function fmt(num){
  if(!isFinite(num)) return '0';
  return Number(num).toLocaleString('en-US',{maximumFractionDigits:2});
}

// ---------- 계산 로직 (4개 항목 상호 연동) ----------
function computeFromUsd(){
  state.local = state.usd * state.country.usdToLocal;
  state.krw = state.usd * state.storeRate;
}
function computeFromLocal(){
  state.usd = state.country.usdToLocal > 0 ? state.local / state.country.usdToLocal : 0;
  state.krw = state.usd * state.storeRate;
}
function computeFromKrw(){
  state.usd = state.storeRate > 0 ? state.krw / state.storeRate : 0;
  state.local = state.usd * state.country.usdToLocal;
}
function computeFromStoreRate(){
  state.krw = state.usd * state.storeRate;
}

// ---------- 렌더링 ----------
function render(activeField){
  if(activeField !== 'storeRate') els.storeRate.value = fmt(state.storeRate);
  if(activeField !== 'usd')       els.usd.value = fmt(state.usd);
  if(activeField !== 'local')     els.local.value = fmt(state.local);
  if(activeField !== 'krw')       els.krw.value = fmt(state.krw);
  updateRealtimeDisplay();
  updateBanner();
}

function updateRealtimeDisplay(){
  const c = state.country;
  els.line1.textContent = `1 USD = ${fmt(BASE_USD_KRW)} 원 (KRW)`;
  const per1000 = (1000 / BASE_USD_KRW) * c.usdToLocal;
  els.line2.textContent = `1,000 원 = ${fmt(per1000)} ${c.currency==='JPY'?'엔':c.currency==='VND'?'동':c.currency==='THB'?'바트':c.currency==='PHP'?'페소':c.currency==='EUR'?'유로':c.currency==='CNY'?'위안':c.currency} (${c.currency})`;
  els.tipLine.textContent = c.tip;
  els.localLabelSmall.textContent = `(${c.currency} : ${localCurrencyKoreanName(c.currency)}) — 직접 입력 가능`;
  els.localSuffix.textContent = c.currency;
}

function localCurrencyKoreanName(cur){
  const map = { VND:'동', USD:'달러', JPY:'엔', THB:'바트', PHP:'페소', SGD:'달러', HKD:'달러', TWD:'달러', EUR:'유로', CNY:'위안' };
  return map[cur] || cur;
}

function updateBanner(){
  if(state.usd <= 0){
    els.banner.className = 'banner same';
    els.banner.textContent = '👉 구매 금액을 입력하면 시세 대비 차액이 표시됩니다.';
    return;
  }
  const marketKrw = state.usd * BASE_USD_KRW;
  const diff = state.krw - marketKrw;
  const diffAbs = Math.abs(diff);
  const diffPct = marketKrw > 0 ? (diffAbs / marketKrw * 100) : 0;

  if(diff > 1){
    els.banner.className = 'banner expensive';
    els.banner.textContent = `⚠️ 실시간 환율보다 ${fmt(diffAbs)}원 더 비쌉니다 (정상가 약 ${fmt(marketKrw)}원 · ${diffPct.toFixed(1)}%)`;
  } else if(diff < -1){
    els.banner.className = 'banner cheap';
    els.banner.textContent = `✅ 실시간 환율보다 ${fmt(diffAbs)}원 더 저렴합니다 (정상가 약 ${fmt(marketKrw)}원 · ${diffPct.toFixed(1)}%)`;
  } else {
    els.banner.className = 'banner same';
    els.banner.textContent = `👍 실시간 환율과 거의 동일합니다 (정상가 약 ${fmt(marketKrw)}원)`;
  }
}

// ---------- 국가 셀렉트 초기화 ----------
COUNTRIES.forEach((c, idx) => {
  const opt = document.createElement('option');
  opt.value = c.code;
  opt.textContent = `${c.flag} ${c.name} (${c.currency})`;
  els.countrySelect.appendChild(opt);
});
els.countrySelect.value = state.country.code;

els.countrySelect.addEventListener('change', () => {
  state.country = COUNTRIES.find(c => c.code === els.countrySelect.value);
  computeFromUsd();
  render(null);
});

// ---------- 입력 이벤트 (서로 연동) ----------
els.storeRate.addEventListener('input', () => {
  state.storeRate = parseNum(els.storeRate.value);
  computeFromStoreRate();
  render('storeRate');
});
els.usd.addEventListener('input', () => {
  state.usd = parseNum(els.usd.value);
  computeFromUsd();
  render('usd');
});
els.local.addEventListener('input', () => {
  state.local = parseNum(els.local.value);
  computeFromLocal();
  render('local');
});
els.krw.addEventListener('input', () => {
  state.krw = parseNum(els.krw.value);
  computeFromKrw();
  render('krw');
});
[els.storeRate, els.usd, els.local, els.krw].forEach(el => {
  el.addEventListener('blur', () => render(null));
  el.addEventListener('focus', () => { el.select(); });
});

// ---------- 매장별 환율 히스토리 비교 ----------
const historyToggle = document.getElementById('historyToggle');
const historyBody = document.getElementById('historyBody');
const historyArrow = document.getElementById('historyArrow');
historyToggle.addEventListener('click', () => {
  historyBody.classList.toggle('open');
  historyArrow.textContent = historyBody.classList.contains('open') ? '▴' : '▾';
});

let historyList = [];
document.getElementById('hAddBtn').addEventListener('click', () => {
  const name = document.getElementById('hName').value.trim() || '매장';
  const rate = parseNum(document.getElementById('hRate').value);
  const usd = parseNum(document.getElementById('hUsd').value);
  if(rate <= 0 || usd <= 0){ alert('환율과 구매액(USD)을 입력해주세요.'); return; }
  const paidKrw = rate * usd;
  historyList.push({ name, rate, usd, paidKrw });
  document.getElementById('hName').value = '';
  document.getElementById('hRate').value = '';
  document.getElementById('hUsd').value = '';
  renderHistory();
});

function renderHistory(){
  const tbody = document.getElementById('historyTbody');
  const table = document.getElementById('historyTable');
  if(historyList.length === 0){ table.style.display = 'none'; return; }
  table.style.display = '';

  const paidList = historyList.map(h => h.paidKrw);
  const minPaid = Math.min(...paidList);
  const maxPaid = Math.max(...paidList);

  tbody.innerHTML = '';
  historyList.forEach((h, i) => {
    const marketKrw = h.usd * BASE_USD_KRW;
    const diff = h.paidKrw - marketKrw;
    const diffClass = diff > 0 ? 'diff-plus' : 'diff-minus';
    const diffText = (diff > 0 ? '+' : '') + fmt(diff) + '원';
    let badge = '';
    if(historyList.length > 1){
      if(h.paidKrw === minPaid) badge = '<span class="badge low">🟢최저가</span>';
      else if(h.paidKrw === maxPaid) badge = '<span class="badge high">🔴바가지주의</span>';
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${h.name}</td>
      <td>${fmt(h.rate)}</td>
      <td>${fmt(h.paidKrw)}</td>
      <td class="${diffClass}">${diffText}</td>
      <td>${badge}</td>
      <td><button class="del-btn" onclick="removeHistory(${i})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}
function removeHistory(i){
  historyList.splice(i, 1);
  renderHistory();
}

// ---------- 초기 실행 ----------
computeFromUsd();
render(null);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('서비스 워커 등록 성공:', reg))
        .catch(err => console.log('서비스 워커 등록 실패:', err));
    });
  }
</script>
 
</body>
</html>
